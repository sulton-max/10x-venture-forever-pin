# Verifies, builds and publishes ForeverPin like every product, through the shared delivery workflow in
# wow-two-platform.pipelines (current → plan → ci → publish):
#   main          → release vX.Y.Z (X.Y from the newest version-track folder), bundle on the GitHub release
#   other branches → candidate sha-<commit>; trunk only, no dev or test branch
#   workflow_dispatch → a candidate for one commit that has no build yet (Wheelhouse's Build action)
#   pull request  → ci only
# A push that changes only docs, planning or markdown runs no build, test or publish; its gate still passes.
# There is no deploy job: Wheelhouse deploys the published bundle to dev, then promotes it to prod.
name: publish-docker-image

on:
  push:
    branches: ['**', '!renovate/**']
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA to build
        required: true

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: delivery-${{ github.repository }}-${{ inputs.commit || github.ref }}
  # main queues, so each release reads the tag the previous one created; other refs cancel a superseded run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
  queue: max

jobs:
  delivery:
    uses: wow-two-platform/wow-two-platform.pipelines/.github/workflows/delivery.yml@v0.10.0
    with:
      commit: ${{ inputs.commit }}
      # Backend: unit, integration, E2E and migration tiers (Testcontainers on the runner's Docker). The SPA build is
      # the frontend check's; the management host's E2E tests need no built app.
      backends: |
        [{"name": "Backend", "dotnet": "engineering/codebase/forever-pin.backend-services/global.json",
          "run": "dotnet test engineering/codebase/forever-pin.backend-services/ForeverPin.BackendServices.slnx -p:BuildSpa=false",
          "paths": ["engineering/codebase/forever-pin.backend-services/**"]}]
      frontends: |
        [{"name": "Frontend", "dir": "engineering/codebase/forever-pin.frontend-services",
          "scripts": ["lint", "test", "build"],
          "paths": ["engineering/codebase/forever-pin.frontend-services/**"]}]
      # Browser: the production build against an in-memory fake API, on desktop and phone, with the axe checks.
      browser: |
        {"name": "Browser", "dir": "engineering/codebase/forever-pin.frontend-services",
         "node": "engineering/codebase/forever-pin.frontend-services/.nvmrc",
         "setup": ["pnpm --filter @foreverpin/web exec playwright install --with-deps chromium", "pnpm build"],
         "run": "pnpm --filter @foreverpin/web exec playwright test",
         "artifact": "engineering/codebase/forever-pin.frontend-services/apps/web/test-results",
         "paths": ["engineering/codebase/forever-pin.frontend-services/**"]}
