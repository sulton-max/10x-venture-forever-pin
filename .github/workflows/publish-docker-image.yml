name: Publish deployment bundle
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
        working-directory: engineering/codebase/forever-pin.frontend-services
      - run: pnpm test && pnpm build
        working-directory: engineering/codebase/forever-pin.frontend-services
      - run: dotnet test engineering/codebase/forever-pin.backend-services/ForeverPin.BackendServices.slnx -p:BuildSpa=false -m:1 --nologo
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image names
        id: names
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be semantic version syntax: $RELEASE_TAG" >&2
            exit 1
          fi
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: management
        with:
          context: engineering/codebase
          file: engineering/deployment/Dockerfile
          target: management
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}:${{ steps.names.outputs.release_tag }}
            ${{ steps.names.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        id: redirect
        with:
          context: engineering/codebase
          file: engineering/deployment/Dockerfile
          target: redirect
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.names.outputs.image }}-redirect:${{ steps.names.outputs.release_tag }}
            ${{ steps.names.outputs.image }}-redirect:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Assemble immutable release
        env:
          MANAGEMENT_IMAGE: ${{ steps.names.outputs.image }}@${{ steps.management.outputs.digest }}
          REDIRECT_IMAGE: ${{ steps.names.outputs.image }}-redirect@${{ steps.redirect.outputs.digest }}
          RELEASE_LABEL: ${{ steps.names.outputs.release_tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 engineering/deployment/create-release.py --output release-bundle \
            --management-image "$MANAGEMENT_IMAGE" --redirect-image "$REDIRECT_IMAGE" \
            --release "$RELEASE_LABEL" --commit "$SOURCE_COMMIT"
          tar -czf foreverpin-release.tar.gz -C release-bundle release.json compose.json
      - uses: actions/upload-artifact@v4
        with:
          name: foreverpin-release-${{ github.sha }}
          path: foreverpin-release.tar.gz
          if-no-files-found: error
      - name: Attach bundle to published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" foreverpin-release.tar.gz
