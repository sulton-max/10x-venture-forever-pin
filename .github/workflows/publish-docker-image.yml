name: Publish deployment bundle
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject republishing a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          # Only an exact 404 permits a new version; auth/network failures stay failures.
          python3 - <<'PYCODE'
          import os, urllib.error, urllib.parse, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GH_REPO'] + '/releases/tags/' + urllib.parse.quote(os.environ['RELEASE_TAG'], safe='')
          request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'ForeverPin-CI'})
          try:
              with urllib.request.urlopen(request, timeout=20):
                  raise SystemExit('Release already exists; use a new version after diagnosis.')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PYCODE
  verify:
    needs: check
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/verify.yml
    with:
      publish: true
      release_tag: ${{ github.ref_name }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assemble immutable bundle
        env:
          REPOSITORY: ${{ github.repository }}
          MANAGEMENT_DIGEST: ${{ needs.verify.outputs.management_digest }}
          REDIRECT_DIGEST: ${{ needs.verify.outputs.redirect_digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          python3 engineering/deployment/create-release.py --output release-bundle \
            --management-image "$image@$MANAGEMENT_DIGEST" --redirect-image "$image-redirect@$REDIRECT_DIGEST" \
            --release "$RELEASE_TAG" --commit "$GITHUB_SHA"
          tar -czf foreverpin-release.tar.gz -C release-bundle release.json compose.json
      - name: Attach assets before publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" \
            --notes "Verified deployment bundle for commit $GITHUB_SHA." "${options[@]}"
          gh release upload "$RELEASE_TAG" foreverpin-release.tar.gz
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
