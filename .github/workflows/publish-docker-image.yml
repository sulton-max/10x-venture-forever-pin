# Builds ForeverPin's deployable bundle with Wheelhouse's release generator, per
# wow-two-ws/conventions/deployment/descriptor/deploy-descriptor.md:
#   push              → a candidate (images tagged sha-<commit>), uploaded as the Actions artifact bundle-<commit>
#   published release → a release (changed images tagged X.Y.Z), attached as foreverpin-release.tar.gz
#   workflow_dispatch → a candidate for one commit that has no build yet (Wheelhouse's Build action)
# Unchanged services keep the previous release's images, found through its attached bundle.
name: publish-docker-image

on:
  push:
    branches: ['**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: The full commit SHA to build
        required: true

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: publish-${{ inputs.commit || github.sha }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      COMMIT: ${{ inputs.commit || github.sha }}
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
      BRANCH: ${{ github.event_name == 'push' && github.ref_name || '' }}
      # The release generator is pinned by content: a git blob survives history rewrites; the SHA-256 guards it.
      WHEELHOUSE_REPOSITORY: wow-two-platform/wow-two-platform.drydock
      RELEASE_GENERATOR_BLOB: 0b079530cd6b2214adaa34917a7aa6c42f933dc7
      RELEASE_GENERATOR_SHA256: 13d060bf8787aaef591fd20708f64eaa02fe5fadbb49172cf0e1ec0b790fc6df
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Fetch the pinned release generator
        env:
          # A private Wheelhouse needs a token that can read it; a public one reads with the workflow token.
          GH_TOKEN: ${{ secrets.WHEELHOUSE_READ_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$WHEELHOUSE_REPOSITORY/git/blobs/$RELEASE_GENERATOR_BLOB" \
            -H "Accept: application/vnd.github.raw+json" > "$RUNNER_TEMP/release.py"
          echo "$RELEASE_GENERATOR_SHA256  $RUNNER_TEMP/release.py" | sha256sum --check --strict
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch the previous release's bundle as the base
        run: |
          set -euo pipefail
          previous=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName \
            --jq "[.[] | select(.tagName != \"${TAG}\") | .tagName][0] // empty")
          if [ -n "$previous" ] && gh release download "$previous" -p foreverpin-release.tar.gz -D base-archive; then
            mkdir -p base
            tar -xzf base-archive/foreverpin-release.tar.gz -C base
            echo "BASE_ARGUMENTS=--base base" >> "$GITHUB_ENV"
          fi
      - name: Build the changed services and write the bundle
        run: |
          set -euo pipefail
          arguments=(build --checkout --commit "$COMMIT" --registry "ghcr.io/${GITHUB_REPOSITORY,,}" --output bundle)
          [ -n "$TAG" ] && arguments+=(--tag "$TAG" --archive foreverpin-release.tar.gz)
          [ -n "$BRANCH" ] && arguments+=(--branch "$BRANCH")
          python3 "$RUNNER_TEMP/release.py" "${arguments[@]}" ${BASE_ARGUMENTS:-}
      - if: github.event_name == 'release'
        run: gh release upload "$TAG" foreverpin-release.tar.gz --clobber
      - if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ inputs.commit || github.sha }}
          path: bundle/
          retention-days: 14
