# Runs the frontend, browser and backend tests on each push to main, then builds both images and exercises them
# against a disposable PostgreSQL. Deployable builds come from publish-docker-image.yml.
name: Validate main
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: engineering/codebase/forever-pin.backend-services/global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.11.0'
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
        working-directory: engineering/codebase/forever-pin.frontend-services
      - run: pnpm test && pnpm build
        working-directory: engineering/codebase/forever-pin.frontend-services
      - name: Browser checks
        run: |
          pnpm --filter @foreverpin/web exec playwright install --with-deps chromium
          pnpm --filter @foreverpin/web exec playwright test
        working-directory: engineering/codebase/forever-pin.frontend-services
      - run: dotnet test engineering/codebase/forever-pin.backend-services/ForeverPin.BackendServices.slnx -p:BuildSpa=false -m:1 --nologo
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: engineering/codebase
          file: engineering/deployment/Dockerfile
          target: management
          platforms: linux/amd64
          load: true
          tags: foreverpin-management:local
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: engineering/codebase
          file: engineering/deployment/Dockerfile
          target: redirect
          platforms: linux/amd64
          load: true
          tags: foreverpin-redirect:local
      - name: Exercise images and persistence
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, secrets
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'foreverpin.env'
          path.write_text('POSTGRES_PASSWORD=' + secrets.token_hex(24) + '\n')
          path.chmod(0o600)
          PY
          compose=(docker compose --env-file "$RUNNER_TEMP/foreverpin.env" -p foreverpin-ci -f engineering/deployment/compose.local.yml)
          "${compose[@]}" up -d --no-build --wait --wait-timeout 180
          smoke=(python3 engineering/deployment/smoke.py --management-url http://127.0.0.1:17021 --redirect-url http://127.0.0.1:17023 --state-file "$RUNNER_TEMP/foreverpin-smoke.json")
          "${smoke[@]}" --create
          "${compose[@]}" up -d --no-build --force-recreate --wait --wait-timeout 180 management redirect
          "${smoke[@]}"
      - name: Stop disposable stack
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/foreverpin.env"; then
            docker compose --env-file "$RUNNER_TEMP/foreverpin.env" -p foreverpin-ci -f engineering/deployment/compose.local.yml down --volumes
          fi
